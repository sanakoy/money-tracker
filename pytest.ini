[pytest]
pythonpath = .
testpaths = tests
xfail_strict = true
asyncio_mode = auto
# Один event loop на всю сессию: фикстура prepare_database тоже живёт всю сессию
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# Тесты с настоящим GigaChat по умолчанию не запускаются: им нужны сеть и ключ,
# а ответ модели может меняться от раза к разу. Запуск: uv run pytest -m live
markers =
    live: запросы к настоящему GigaChat
addopts = -m "not live"
