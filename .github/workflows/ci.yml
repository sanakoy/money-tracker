name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Токен GITHUB_TOKEN может только читать код: писать в репозиторий, PR и релизы
# проверкам не нужно
permissions:
  contents: read

# Новый push в ту же ветку отменяет ещё не законченный прогон предыдущего
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтер и форматирование
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Не оставлять токен GitHub в конфиге git: следующим шагам (и зависимостям,
          # которые ставит pip) доступ на запись в репозиторий не нужен
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked: ставим ровно то, что в uv.lock, иначе падаем
      - run: uv sync --locked

      - name: ruff
        run: uv run ruff check src tests evals

      - name: black
        run: uv run black --check src tests evals

      - name: mypy
        run: uv run mypy

  test:
    name: Тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        # Тесты стартуют только после того, как Postgres начнёт принимать подключения
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # .env.local в репозитории нет: settings читает эти же переменные из окружения
    env:
      # Основная БД тестами не используется, но settings требует её параметры.
      # Имя должно отличаться от тестовой, иначе tests/utils.py откажется запускаться
      DB_USER: user
      DB_PASSWORD: password
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: app_db
      TEST_DB_USER: user
      TEST_DB_PASSWORD: password
      TEST_DB_HOST: localhost
      TEST_DB_PORT: 5432
      TEST_DB_NAME: test_db
      # Ключ только для подписи токенов в тестах, это не секрет продакшена
      SECRET_TOKEN_KEY: ci-only-not-a-real-secret
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 30
      SERVICE_URL: http://localhost:8001
      # Разные логические БД Redis: тесты очищают свою целиком
      REDIS_URL: redis://localhost:6379/0
      TEST_REDIS_URL: redis://localhost:6379/1

    steps:
      - uses: actions/checkout@v5
        with:
          # Не оставлять токен GitHub в конфиге git: следующим шагам (и зависимостям,
          # которые ставит pip) доступ на запись в репозиторий не нужен
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: pytest
        run: uv run pytest

  frontend:
    name: Фронтенд
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          # Та же major-версия, что в образе фронта (node:24-alpine)
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci: ровно то, что в package-lock.json, иначе падаем
      - run: npm ci

      - name: oxlint
        run: npm run lint

      - name: vitest
        run: npm test

      # build включает tsc -b: отдельный шаг проверки типов не нужен
      - name: Сборка
        run: npm run build

  docker:
    name: Сборка Docker-образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Только сборка, без публикации: ловит сломанный Dockerfile или
      # зависимость, которая ставится локально, но не в чистом образе
      - name: Бэкенд
        run: docker build --tag money-tracker-backend .

      - name: Фронтенд
        run: docker build --tag money-tracker-frontend frontend
